[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-ai-audit"
version = "0.2.0"
description = "Verifiable Evidence & Risk Identification Toolkit for AI Systems (NIST AI RMF Audit Pipeline)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Emperor2004", email = "panditom2003@gmail.com" },
]
dependencies = [
    "scikit-learn>=1.4",
    "fairlearn>=0.10",
    "faker>=25.0",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "jinja2>=3.1",
    "reportlab>=4.0",
    "pandas>=2.0",
    "pydantic>=2.6",
    "langgraph>=1.2,<2.0",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
veritas = "src.orchestrator:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --import-mode=importlib"
