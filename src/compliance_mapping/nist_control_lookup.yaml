# nist_control_lookup.yaml
# Static, versioned lookup table: VERITAS finding type -> NIST AI RMF control ID(s).
# Source: NIST AI RMF Playbook (companion to NIST AI 100-1, AI RMF 1.0), 72-subcategory dataset.
# Deterministic rules only -- no learned/generative mapping (see README §10).

metadata:
  version: "0.1.0"
  source: "NIST AI RMF Playbook (nist_ai_rmf_playbook.json)"
  framework: "NIST AI 100-1, AI RMF 1.0"
  last_reviewed: "2026-09-17"

# Full text of each referenced control, kept here so explainability_trace.py
# can cite the exact action language a finding was matched against, not just
# a bare control ID.
controls:
  MEASURE_2_4:
    id: "MEASURE 2.4"
    title: "Functionality and behavior of the AI system are monitored when in production."
    topics: [TEVV, Monitoring, Drift]
    matched_action_text: >
      Monitor for anomalies using approaches such as control limits, confidence
      intervals, integrity constraints and ML algorithms. When anomalies are
      observed, consider error propagation and feedback loop risks.
    citation: "NIST AI RMF Playbook, MEASURE 2.4"

  MEASURE_2_11:
    id: "MEASURE 2.11"
    title: "Fairness and bias are evaluated and results are documented."
    topics: [TEVV, "Fairness and Bias", "Trustworthy Characteristics"]
    matched_action_text: >
      Conduct fairness assessments to manage computational and statistical
      forms of bias... quantify harms using a general fairness metric (e.g.
      demographic parity, equalized odds, equal opportunity, statistical
      hypothesis tests).
    citation: "NIST AI RMF Playbook, MEASURE 2.11"

  MAP_5_1:
    id: "MAP 5.1"
    title: "Likelihood and magnitude of each identified impact are identified and documented."
    topics: [Participation, "Impact Assessment"]
    matched_action_text: >
      Identify and document likelihood and magnitude of system benefits and
      negative impacts in relation to trustworthiness characteristics.
    citation: "NIST AI RMF Playbook, MAP 5.1"

  MANAGE_1_3:
    id: "MANAGE 1.3"
    title: "Responses to the AI risks deemed high priority are developed, planned, and documented."
    topics: [Risk Response, "Risk Management"]
    matched_action_text: >
      Document trade-offs, decision processes, and relevant measures taken to
      address the identified risks in consultation with domain experts and
      other relevant AI actors.
    citation: "NIST AI RMF Playbook, MANAGE 1.3"

  MANAGE_1_4:
    id: "MANAGE 1.4"
    title: "Negative residual risks to both downstream acquirers and end users are documented."
    topics: [Risk Response, Documentation]
    matched_action_text: >
      Document context-specific measures to understand and trace negative
      residual risks (the sum of all unmitigated risk) both within and
      beyond the organization.
    citation: "NIST AI RMF Playbook, MANAGE 1.4"

# Severity is a property of the FINDING, not of the finding_type or metric --
# this is what makes escalation generalize to data the current dataset
# doesn't exercise. Any module (existing or future) that tags a finding with
# one of these tiers gets the same MANAGE-stage treatment automatically, with
# no change needed here or in rules_engine.py when volumes or instance-mix
# shift on a new dataset.
severity_tiers:
  informational:
    description: "Below enforcement threshold, or no enforced threshold exists yet. Reported, never discarded."
    escalates_to: []
  violation:
    description: "Crossed an enforced threshold."
    escalates_to: [MANAGE_1_3, MANAGE_1_4]

# Finding-type -> control mapping consumed by rules_engine.py.
# Every finding produced by Phase 2/3 must resolve to an entry here;
# an unmapped finding_type must fail loudly (see README §12 -- no silent discard).
finding_mappings:

  anomaly_finding:
    primary_control: MEASURE_2_4
    secondary_control: MAP_5_1
    rationale: >
      IsolationForest-based unsupervised outlier detection over prediction
      logs is the literal example method named in MEASURE 2.4's action text.
      MEASURE 2.7 (Secure and Resilient) was considered and rejected: its
      action text is red-team/adversarial-testing language, which does not
      describe statistical anomaly detection over normal operational logs.
    severity_policy:
      threshold_source: internal_design_choice   # 3% injection rate -- see recalibration_required below
      severity_tier: informational                 # sub-threshold default; see rules_engine.py for the crossing check

  fairness_finding:
    primary_control: MEASURE_2_11
    secondary_control: MAP_5_1
    rationale: >
      Demographic parity, disparate impact ratio, and equalized odds are the
      named example metrics in MEASURE 2.11's action text.
    metrics:
      disparate_impact_ratio:
        threshold_source: externally_cited     # EEOC four-fifths rule (0.8) -- ratio is dataset-agnostic, does not need recalibration
        severity_tier: dynamic                   # resolved per-run: violation if ratio < 0.8, else informational
      demographic_parity_difference:
        threshold_source: statistical_permutation_test   # data-driven; see method note below
        severity_tier: dynamic                             # resolved per-run: violation if observed value exceeds the permutation-derived critical value, else informational
      equalized_odds_difference:
        threshold_source: statistical_permutation_test
        severity_tier: dynamic

# Method for statistical_permutation_test threshold_source: IMPLEMENTED as
# permutation_significance_test() in src/fairness_scanner/thresholds.py,
# wired into metrics.py's compute_fairness_metrics_for_attribute. The
# violation flag arrives already resolved on the raw fairness finding
# (demographic_parity_violation / equalized_odds_violation) before this
# engine ever sees it -- this file's rules_engine.py does not run the test
# itself; see input_reconciler.py for how the flag becomes severity_tier.
#   1. Compute the observed metric on real data.
#   2. Shuffle protected-attribute labels (predictions and true labels fixed),
#      recompute the metric, repeat `permutations` times -> null distribution.
#   3. violation = observed value exceeds the (1 - significance_level)
#      percentile of the null distribution (one-tailed; these metrics are
#      non-negative by construction).
# significance_level below documents the SAME value read from config.yaml's
# fairness.significance_level at runtime -- not an independent copy.
statistical_threshold_config:
  significance_level: 0.05   # policy choice, not derived from data -- disclose this in any audit report
  permutations: 1000

# Config values that are shaped by THIS dataset (UCI Adult Income + synthetic
# metadata) and must be re-set, not assumed, before running against a
# company's real data. Listing these explicitly here -- rather than
# discovering them live during a company test run -- is the actual
# "prepared beforehand" this file can honestly deliver.
recalibration_required:
  - config_key: "protected_attributes"
    reason: "Currently [sex, race] -- UCI Adult Income's columns. A company's protected classes must be set with legal/compliance input, not inferred from column names."
  - config_key: "fairness.min_group_size_warning"
    reason: "Currently 20, sized to this dataset. Should scale with the company dataset's total population, not stay a fixed constant."
  - config_key: "anomaly_injection.injection_rate"
    reason: "0.03 is a synthetic-data design choice for detector evaluation, not a real-world anomaly base rate. Not applicable to a real dataset at all -- there is no injection step against real company logs."
  - config_key: "statistical_threshold_config.significance_level"
    reason: "0.05 is a conventional statistical default, not derived from any dataset. It is a disclosed policy choice controlling false-positive sensitivity on fairness flags -- confirm it's the right value for this context (e.g. a stricter 0.01 may be warranted for high-stakes lending decisions) rather than leaving the default unexamined."

# Anything not listed under finding_mappings (a new finding_type from a
# future module, or a typo in an upstream module) must raise a load-time/
# lookup-time error in rules_engine.py, not be skipped -- fail-loud, same
# pattern as src/ingestion/schema.py. This does NOT need to anticipate every
# possible future finding type: a genuinely new finding type implies a new
# detection module was built for it, which is a code change regardless of
# what this file says.