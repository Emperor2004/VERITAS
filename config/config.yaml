paths:
  raw_dir: data/raw
  processed_dir: data/processed
  synthetic_dir: data/synthetic_logs

dataset:
  source: uci_adult_income
  uci_repo_id: 2   # UCI ML Repository ID for the "Adult" dataset
  local_cache_csv: data/raw/adult_income.csv

audit_subject_model:
  algorithm: logistic_regression
  test_size: 0.2
  random_state: 42

protected_attributes:
  - sex
  - race

fairness:
  disparate_impact_ratio_threshold: 0.8   # EEOC Uniform Guidelines -- four-fifths rule
  min_group_size_warning: 20              # flag groups smaller than this as statistically unstable
  significance_level: 0.05                # policy choice, not derived from data -- controls false-positive
                                           # sensitivity for demographic_parity_difference / equalized_odds_difference
  permutations: 1000                      # null-distribution size for the permutation significance test
  permutation_random_state: 42            # fixed for reproducibility -- an unseeded permutation test can
                                           # flip a boundary-case verdict between identical runs on the same data

synthetic_metadata:
  session_id_prefix: "SESS"
  auth_methods: ["password", "sso", "mfa_token", "biometric"]
  timestamp_start: "2026-01-01T00:00:00"
  timestamp_end: "2026-06-30T23:59:59"

anomaly_injection:
  # Deliberately injects a small, known rate of anomalies so the anomaly
  # detector has genuine signal to find (rather than uniform Faker noise)
  # and so detection performance can actually be measured against a
  # ground-truth label in phase 2. This label MUST NOT be fed into
  # IsolationForest's feature set -- it exists only for evaluation.
  #
  # The total rate below is split across three independent patterns by
  # type_weights (normalized internally -- need not sum to 1), so
  # anomaly_detection.isolation_forest.contamination still only needs to
  # match this one injection_rate, unchanged.
  injection_rate: 0.03
  random_state: 7
  rare_auth_methods: ["legacy_token", "unverified_device"]
  normal_hour_range: [7, 22]   # 7am-10pm treated as normal operating hours

  type_weights:
    # Synthetic-metadata pattern (original): off-hours timestamp + rare
    # auth method, injected together.
    off_hours_rare_auth: 0.4
    # Real-feature pattern: implausible combination of actual UCI columns.
    # Tests the detector on the audit subject's own inputs, not just
    # synthetic wrapper fields.
    feature_outlier: 0.3
    # Real-feature pattern: exact duplicate of another (non-anomalous)
    # record's full feature set. Deliberately left undetectable by
    # IsolationForest -- see feature_anomalies.py docstring and README
    # known-limitations.
    duplicate_record: 0.3

  feature_outlier:
    age_range: [12, 17]              # below legal working age in the source jurisdiction
    hours_per_week_range: [90, 99]   # dataset max is 99; this plus a teenage age is the implausible pair
    capital_gain_min: 90000          # dataset-wide capital-gain is heavily right-skewed; this is far upper tail

anomaly_detection:
  isolation_forest:
    # NOTE: contamination is set to match anomaly_injection.injection_rate
    # above (0.03). If you change one, change the other -- sklearn does not
    # read this dynamically from the injection config. In production this
    # should be lower for a real bank population; kept at 0.03 here to
    # match what we deliberately injected during ingestion.
    contamination: 0.03
    n_estimators: 100
    random_state: 42