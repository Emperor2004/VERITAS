# =============================================================================
# VERITAS — Nginx Reverse Proxy (optional, for HTTPS termination)
# =============================================================================
# Usage with docker-compose:
#   Place SSL certs in ./nginx/certs/ and uncomment the nginx service
#   in docker-compose.prod.yml.
#
# Without Docker: sudo nginx -c /path/to/this/nginx.conf
# =============================================================================

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    # --- API routes → FastAPI backend ---
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long timeout for audit pipeline execution
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Upload size limit (matches backend MAX_UPLOAD_SIZE_BYTES)
        client_max_body_size 10M;
    }

    # --- All other routes → Next.js frontend ---
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # --- Security headers ---
    add_header X-Frame-Options        "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-XSS-Protection       "1; mode=block"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}

